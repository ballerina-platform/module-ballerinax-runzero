    Credential:
      required:
      - id
      type: object
      properties:
        last_used_at:
          type: integer
          format: int64
          example: 1576300370
          x-ballerina-name: lastUsedAt
        name:
          type: string
          example: credentials_name
        created_at:
          type: integer
          format: int64
          example: 1576300370
          x-ballerina-name: createdAt
        global:
          type: boolean
          example: false
        id:
          type: string
          format: uuid
          example: e77602e0-3fb8-4734-aef9-fbc6fdcb0fa8
        created_by_id:
          type: string
          format: uuid
          example: e77602e0-3fb8-4734-aef9-fbc6fdcb0fa8
          x-ballerina-name: createdById
        acl:
          type: object
          additionalProperties: true
          example:
            e77602e0-3fb8-4734-aef9-fbc6fdcb0fa8: user
        cidrs:
          type: array
          example:
          - 10.0.0.47/32
          - 192.168.1.0/24
          items:
            type: string
        last_used_by_id:
          type: string
          format: uuid
          example: e77602e0-3fb8-4734-aef9-fbc6fdcb0fa8
          x-ballerina-name: lastUsedById
        type:
          type: string
          description: The service the credentials are for
          enum:
          - miradore_api_key_v1
          - aws_access_secret
          - crowdstrike_api_key
          - azure_client_secret
          - azure_username_password
          - censys_search_api_key
          - snmpv2_community
          - snmpv3_credential
          - vmware_username_password
        created_by_email:
          type: string
          format: email
          example: user@example.com
          x-ballerina-name: createdByEmail
        client_id:
          type: string
          format: uuid
          example: e77602e0-3fb8-4734-aef9-fbc6fdcb0fa8
          x-ballerina-name: clientId
    HealthCheckResponse:
      required:
      - status
      - version
      type: object
      properties:
        version:
          type: string
          description: Version of the runZero platform
          format: string
          example: 3.0.0
        status:
          type: string
          description: Health status reported by the platform
          format: string
          example: ok
      description: A health check response and version
    AddressExtraIpv4:
      format: ipv4
    ServiceAddressesExtra:
      type: string
      example: 192.168.100.1
      oneOf:
      - $ref: '#/components/schemas/AddressExtraIpv4Alt1'
      - $ref: '#/components/schemas/AddressExtraIpv6Alt1'
    ShodanCredentialFields:
      required:
      - api_key
      type: object
      properties:
        api_key:
          type: string
          format: string
          x-ballerina-name: apiKey
    APIKeyOptions:
      type: object
      properties:
        organization_id:
          type: string
          format: uuid
          example: e77602e0-3fb8-4734-aef9-fbc6fdcb0fa8
          x-ballerina-name: organizationId
        comment:
          type: string
          example: Splunk integration key
    VulnerabilityAddresses:
      type: string
      example: 192.168.0.1
      oneOf:
      - $ref: '#/components/schemas/AddressIpv4Alt2'
      - $ref: '#/components/schemas/AddressIpv6Alt2'
    ScanTemplate:
      required:
      - acl
      - global
      - id
      - organization_id
      type: object
      properties:
        agent_id:
          type: string
          description: ID of the explorer which may execute the template
          format: uuid
          example: e77602e0-3fb8-4734-aef9-fbc6fdcb0fa8
          x-go-type: uuid.UUID
          x-go-import:
            name: uuid
            path: github.com/gofrs/uuid
          x-ballerina-name: agentId
        hidden:
          type: boolean
          description: A flag indicating whether the item is hidden from common view
          example: false
        description:
          type: string
          description: The description of the template
          example: My Scan Template
        created_at:
          type: integer
          description: Unix timestamp value indicating when the template was created
          format: int64
          example: 1576300370
          x-ballerina-name: createdAt
        global:
          type: boolean
          description: Whether the template is globally available to all organizations
          example: false
        acl:
          type: object
          additionalProperties: true
          description: A map of IDs to strings which describe how the template may be accessed. Currently
            there is no authoritative list of in-use values. See existing templates for examples
          example:
            e77602e0-3fb8-4734-aef9-fbc6fdcb0fa8: user
        type:
          type: string
          description: The type of task the template creates
          example: scan
        error:
          type: string
          description: The error message, if any, of the last task using the template
          example: agent unavailable
        client_id:
          type: string
