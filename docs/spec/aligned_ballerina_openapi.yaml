openapi: 3.0.0
info:
  title: runZero API
  description: Manage runZero network asset discovery and inventory, including organizations, sites, assets,
    scans, tasks, users and integrations, through the runZero REST API.
  contact:
    email: support@runzero.com
  license:
    name: Commercial
    url: https://www.runzero.com/legal/terms
  version: 4.0.251021.0
servers:
- url: https://console.runzero.com/api/v1.0
  description: runZero Console
security:
- bearerAuth: []
- oauthDefaults: []
tags:
- name: Account
  description: Requires Account key (starts with CT), or OAuth
- name: Organization
  description: Requires Organization key (starts with OT), Account key (starts with CT), or OAuth
- name: Export
  description: Requires Export token (starts with ET), Organization key (starts with OT), Account key
    (starts with CT), or OAuth
- name: Import
  description: Requires Organization key (starts with OT), Account key (starts with CT), or OAuth
- name: Public
  description: Unauthenticated
paths:
  /releases/agent/version:
    get:
      tags:
      - Public
      summary: Returns latest agent version
      operationId: getLatestAgentVersion
      responses:
        '200':
          description: component version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentVersion'
      security: []
  /releases/scanner/version:
    get:
      tags:
      - Public
      summary: Returns latest scanner version
      operationId: getLatestScannerVersion
      responses:
        '200':
          description: component version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentVersion'
      security: []
  /releases/platform/version:
    get:
      tags:
      - Public
      summary: Returns latest platform version
      operationId: getLatestPlatformVersion
      responses:
        '200':
          description: component version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentVersion'
      security: []
  /health:
    get:
      tags:
      - Public
      summary: Returns a health check status (cloud and self-hosted)
      operationId: getHealthCheck
      responses:
        '200':
          description: health status and current version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
      security: []
  /import/org/{orgID}/assets:
    post:
      tags:
      - Organization
      - Import
      summary: Import assets described by a registered custom integration
      description: 'Assets can be discovered, imported, and merged by runZero scan tasks, first-party
        integrations, and third-party

        defined custom integrations. See [/account/custom-integrations](#/account/getAccountCustomIntegrations).
        Currently only assets for custom integrations are importable here.

        '
      operationId: importCustomIntegrationAssets
      parameters:
      - name: orgID
        in: path
        description: The ID of the organization to import the assets into
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
      requestBody:
        description: Custom integration asset import payload with assets to create or merge
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NewAssetImport'
            encoding:
              assetData:
                contentType: application/gzip
                style: form
        required: true
      responses:
        '200':
          description: import task created. The task ID should be checked for its status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/InvalidRequestBodyError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/NotAllowedForLicenseError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/InvalidRequestBodyError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /export/org/assets.json:
    get:
      tags:
      - Export
      summary: Exports the asset inventory
      operationId: exportAssetsJSON
      responses:
        '200':
          description: Filtered asset results. <ul><li>When the `page_size` query parameter is not set
            in the request, the response will be a JSON array of assets.</li><li>When the `page_size`
            query parameter is present in the request, the response will be an object with an assets array
            and a `next_key` string for pagination.</li></ul>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportAssetsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    parameters:
    - $ref: '#/components/parameters/orgID'
    - $ref: '#/components/parameters/search'
    - $ref: '#/components/parameters/fields'
    - $ref: '#/components/parameters/pageSize'
    - $ref: '#/components/parameters/startKey'
  /export/org/assets.jsonl:
    get:
      tags:
      - Export
      summary: Asset inventory as JSON line-delimited
      operationId: exportAssetsJSONL
      responses:
        '200':
          description: filtered asset results
          content:
            application/json:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    parameters:
    - $ref: '#/components/parameters/orgID'
    - $ref: '#/components/parameters/search'
    - $ref: '#/components/parameters/fields'
